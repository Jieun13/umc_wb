<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>회원가입</title>
    <style>
        /* 기존 스타일 유지 */
    </style>
</head>
<body>
<h2>회원가입</h2>
<form th:action="@{/members/signup}" th:object="${memberJoinDto}" method="post">
    <div th:if="${error}" th:text="${error}" style="color: red;"></div>

    <div>
        <label for="name">이름:</label>
        <input type="text" id="name" th:field="*{name}" required>
    </div>
    <div>
        <label for="email">이메일:</label>
        <input type="email" id="email" th:field="*{email}" required>
    </div>
    <div>
        <label for="password">비밀번호:</label>
        <input type="password" id="password" th:field="*{password}" required>
    </div>
    <div>
        <label for="phone">전화번호:</label>
        <input type="text" id="phone" th:field="*{phone}" required>
    </div>
    <div>
        <label for="gender">성별:</label>
        <select id="gender" th:field="*{gender}">
            <option value="1">남성</option>
            <option value="2">여성</option>
            <option value="3">선택안함</option>
        </select>
    </div>
    <div>
        <label for="address">주소:</label>
        <input type="text" id="address" th:field="*{address}" required>
    </div>
    <div>
        <label>선호 카테고리:</label>
        <div class="preferCategory">
            <label><input type="checkbox" name="preferCategory" value="1"> 중식</label>
            <label><input type="checkbox" name="preferCategory" value="2"> 양식</label>
            <label><input type="checkbox" name="preferCategory" value="3"> 치킨</label>
            <label><input type="checkbox" name="preferCategory" value="4"> 분식</label>
            <label><input type="checkbox" name="preferCategory" value="5"> 고기/구이</label>
            <label><input type="checkbox" name="preferCategory" value="6"> 도시락</label>
            <label><input type="checkbox" name="preferCategory" value="7"> 야식</label>
            <label><input type="checkbox" name="preferCategory" value="8"> 패스트푸드</label>
            <label><input type="checkbox" name="preferCategory" value="9"> 디저트</label>
        </div>
    </div>
    <div>
        <label for="role">역할:</label>
        <select id="role" th:field="*{role}">
            <option value="USER">일반 사용자</option>
            <option value="ADMIN">관리자</option>
        </select>
    </div>
    <button type="submit">가입하기</button>
</form>
</body>
</html>
